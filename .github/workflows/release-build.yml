name: Release Build

# Builds a universal Release app, signs it with the Developer ID certificate, notarizes and staples the app and
# the DMG, then either attaches them to a draft GitHub release or uploads them as workflow artifacts.
# DiskDuster isn't sandboxed, so it ships through GitHub releases only (no Mac App Store build).

on:
  workflow_call:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0). A leading v, as in a tag name, is removed.
        required: true
        type: string
      build_number:
        description: CFBundleVersion
        required: true
        type: string
      publish_release:
        description: Attach the build to a draft GitHub release (otherwise upload it as a workflow artifact)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26  # Minimum supported macOS; Apple Silicon runner
    env:
      APP_NAME: DiskDuster
      APP_PATH: dist/DiskDuster.app
      KEYCHAIN: build.keychain
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$INPUT_VERSION' isn't a semantic version like 1.0.0"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run clean, test
        run: make clean test

      - name: Validate required secrets are present
        env:
          APPLE_DEVID_CERT_BASE64: ${{ secrets.APPLE_DEVID_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          REQUIRED_VARS=(
            APPLE_DEVID_CERT_BASE64
            APPLE_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_SIGNING_IDENTITY
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY
          )
          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret/value: $var"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_DEVID_CERT_BASE64: ${{ secrets.APPLE_DEVID_CERT_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_DEVID_CERT_BASE64" | base64 --decode > devid.p12
          security import devid.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm devid.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Validate signing identity in CI keychain
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning "$KEYCHAIN" | tee codesign-identities.txt
          if ! grep -F "$APPLE_SIGNING_IDENTITY" codesign-identities.txt > /dev/null; then
            echo "::error::APPLE_SIGNING_IDENTITY not found in $KEYCHAIN: $APPLE_SIGNING_IDENTITY"
            exit 1
          fi
          if ! grep -F "Developer ID Application" codesign-identities.txt > /dev/null; then
            echo "::error::No Developer ID Application identity found in the imported certificate."
            exit 1
          fi

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Generate build info
        run: |
          COMMIT="${{ github.sha }}" \
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" \
          CONFIG="Release" \
          ARCH="universal" \
          make generate-build-info

      - name: Build universal Release app
        run: |
          set -euo pipefail
          TAGVER="$VERSION" BUILDNUM="${{ inputs.build_number }}" make build-release-unsigned
          lipo -info "$APP_PATH/Contents/MacOS/$APP_NAME"
          for arch in arm64 x86_64; do
            lipo "$APP_PATH/Contents/MacOS/$APP_NAME" -verify_arch "$arch"
          done

      - name: Code sign app (Developer ID, hardened runtime)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # DiskDuster needs no entitlements: it isn't sandboxed and uses no capabilities.
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=2 "$APP_PATH"

      - name: Notarize and staple app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP_PATH" dist/notarization.zip
          ./.github/scripts/notarize.sh dist/notarization.zip
          rm dist/notarization.zip
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package zip
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP_PATH" "$APP_NAME-$VERSION-macOS-universal.zip"

      - name: Package, sign, notarize and staple DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG_FILE="$APP_NAME-$VERSION-macOS-universal.dmg"
          mkdir -p dmg-contents
          cp -R "$APP_PATH" dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder dmg-contents -ov -format UDZO "$DMG_FILE"
          rm -rf dmg-contents
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_FILE"
          ./.github/scripts/notarize.sh "$DMG_FILE"
          xcrun stapler staple "$DMG_FILE"
          xcrun stapler validate "$DMG_FILE"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG_FILE"

      - name: Write checksums
        run: |
          shasum -a 256 "$APP_NAME-$VERSION"-macOS-universal.* | tee "$APP_NAME-$VERSION-SHA256SUMS.txt"

      - name: Upload build artifacts
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          path: |
            ${{ env.APP_NAME }}-${{ env.VERSION }}-macOS-universal.zip
            ${{ env.APP_NAME }}-${{ env.VERSION }}-macOS-universal.dmg
            ${{ env.APP_NAME }}-${{ env.VERSION }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}-${{ env.VERSION }}-macOS-universal.zip
            ${{ env.APP_NAME }}-${{ env.VERSION }}-macOS-universal.dmg
            ${{ env.APP_NAME }}-${{ env.VERSION }}-SHA256SUMS.txt
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf ~/private_keys
