name: Release

on:
  push:
    tags:
      # Semantic version tags: v1.0.0, v2.1.3, etc.
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository_owner == 'centennial-oss'
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      build_number: ${{ github.run_number }}
      publish_release: true
